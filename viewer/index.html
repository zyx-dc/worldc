<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WorldSource · 世界</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#08090c; overflow:hidden;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  .hud { position:fixed; pointer-events:none; color:#e8e6e1; z-index:3; }
  #brand { left:24px; top:20px; }
  #brand .t { font-size:13px; letter-spacing:.14em; color:#8b8780; }
  #brand .w { font-size:17px; font-weight:500; margin-top:4px; }

  #where { left:24px; bottom:24px; }
  #where .r { font-size:19px; font-weight:500; }
  #where .m { font-size:11px; color:#8b8780; margin-top:5px; letter-spacing:.06em; }

  #vendor { right:24px; bottom:24px; text-align:right; font-size:11px; color:#6c6862; letter-spacing:.06em; }

  #cross { position:fixed; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px;
    border-radius:50%; background:rgba(255,255,255,.55); pointer-events:none; z-index:2; }

  #tip { position:fixed; left:50%; bottom:64px; transform:translateX(-50%);
    max-width:min(560px,80vw); padding:12px 18px; border-radius:10px;
    background:rgba(14,16,20,.86); border:.5px solid rgba(255,255,255,.14);
    opacity:0; transition:opacity .18s; pointer-events:none; z-index:3; }
  #tip.on { opacity:1; }
  #tip .tt { font-size:15px; line-height:1.45; }
  #tip .tm { font-size:11px; color:#8b8780; margin-top:6px; letter-spacing:.06em; }

  #gate { position:fixed; inset:0; display:grid; place-content:center; gap:14px;
    text-align:center; background:rgba(8,9,12,.92); cursor:pointer; z-index:10;
    transition:opacity .3s; }
  #gate.gone { opacity:0; pointer-events:none; }
  #gate h1 { font-size:20px; font-weight:500; margin:0; letter-spacing:.02em; }
  #gate p { font-size:13px; color:#8b8780; margin:0; line-height:1.9; }
  #gate .k { color:#e8e6e1; border:.5px solid rgba(255,255,255,.25);
    border-radius:4px; padding:1px 6px; font-size:12px; }

  #err { position:fixed; inset:0; display:none; place-content:center; padding:40px;
    color:#e8a0a0; font:13px/1.7 ui-monospace,Consolas,monospace; white-space:pre-wrap; z-index:20; }

  /* ── 编辑器 ── */
  #editor { position:fixed; left:0; top:0; bottom:0; width:470px; z-index:6;
    display:none; flex-direction:column;
    background:rgba(9,11,15,.94); border-right:.5px solid rgba(255,255,255,.1);
    backdrop-filter:blur(2px); }
  #editor.on { display:flex; }
  #editor .head { display:flex; align-items:center; gap:10px; padding:14px 18px 10px; }
  #editor .tag { font:11px ui-monospace,Consolas,monospace; letter-spacing:.1em;
    color:#ccd3dd; background:rgba(255,255,255,.07); border:.5px solid rgba(255,255,255,.12);
    border-radius:4px; padding:2px 7px; }
  #estat { font:11px ui-monospace,Consolas,monospace; color:#7f9a7f; letter-spacing:.04em; }
  #estat.bad { color:#e09090; }
  #src { flex:1; width:100%; box-sizing:border-box; resize:none; border:0; outline:none;
    background:transparent; color:#cdd5e0; padding:6px 16px 16px;
    font:12px/1.75 ui-monospace,Consolas,"Cascadia Mono",monospace; tab-size:2; }
  #editor .foot { padding:10px 18px 14px; font-size:11px; line-height:1.7; color:#6c6862;
    border-top:.5px solid rgba(255,255,255,.07); }
  #editor .foot b { color:#b8b3aa; font-weight:500; }
</style>
</head>
<body>
<div id="app"></div>
<div id="vig" style="position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 72% 62% at 50% 47%, rgba(0,0,0,0) 38%, rgba(0,0,0,.6) 100%)"></div>

<div id="brand" class="hud">
  <div class="t">WORLDSOURCE</div>
  <div class="w" id="worldName">—</div>
</div>

<div id="where" class="hud">
  <div class="r" id="regionName">入口</div>
  <div class="m" id="regionMeta"></div>
</div>

<div id="vendor" class="hud"></div>
<div id="cross"></div>

<div id="tip"><div class="tt" id="tipTitle"></div><div class="tm" id="tipMeta"></div></div>

<div id="editor">
  <div class="head">
    <span class="tag">world.dsl</span>
    <span id="estat">等待编译</span>
  </div>
  <textarea id="src" spellcheck="false" wrap="off"></textarea>
  <div class="foot">
    <b>改文本</b> → 右边世界立刻重建　　<b>拖动展板</b> → 源码里写回一条 pin<br/>
    <b>E</b> 回到漫游　　<b>Esc</b> 退出编辑
  </div>
</div>

<div id="gate">
  <h1>点击进入你的收藏夹</h1>
  <p>
    <span class="k">W A S D</span> 移动　<span class="k">鼠标</span> 环顾　<span class="k">Shift</span> 快走　<span class="k">R</span> 自动前进<br/>
    <span class="k">E</span> 编辑源码　　<span class="k">Esc</span> 退出
  </p>
</div>

<div id="err"></div>

<script type="module">
  const showErr = (e) => {
    const el = document.getElementById('err');
    el.style.display = 'grid';
    el.textContent = '渲染失败\n\n' + (e && e.stack ? e.stack : String(e)) +
      '\n\n如果是从 file:// 打开的，需要通过本地服务器访问（node serve.mjs）。';
  };
  window.addEventListener('error', (e) => showErr(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => showErr(e.reason));
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
